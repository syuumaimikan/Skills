name: Weekly Algorithm Maintenance & Optimization Challenge

on:
  schedule:
    # Runs every Monday at 00:00 UTC (09:00 JST)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-weekly-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Weekly Optimization Issue
        uses: actions/github-script@v7
        with:
          script: |
            const challenges = [
              {
                title: "🚀 [Optimization Challenge] SIMD Matrix Multiplication & Cache Tuning",
                body: "## 🎯 Weekly Objective\nReview and benchmark cache-oblivious algorithms in `src/rust/simd_math.rs` and `src/cpp/include/memory_pool.hpp`.\n\n### Tasks\n- [ ] Measure L1/L2 cache misses\n- [ ] Profile AVX2/AVX-512 vectorization\n- [ ] Run `python scripts/skills_cli.py bench`"
              },
              {
                title: "🔒 [Security Challenge] Merkle Tree Audit Proof Performance",
                body: "## 🎯 Weekly Objective\nAudit SHA-256 batch hashing throughput in `src/typescript/data_structures/merkle_tree.ts`.\n\n### Tasks\n- [ ] Profile tree reconstruction with 10,000+ leaves\n- [ ] Verify zero memory leaks during audit proofs"
              },
              {
                title: "⚡ [Concurrency Challenge] Lock-Free SkipList & RingBuffer Throughput",
                body: "## 🎯 Weekly Objective\nVerify multi-threaded scalability in `src/rust/skip_list.rs` and `src/go/workerpool/pool.go`.\n\n### Tasks\n- [ ] Run high-contention thread tests\n- [ ] Benchmark token bucket rate limiters under 100k RPS"
              }
            ];

            const pick = challenges[Math.floor(Math.random() * challenges.length)];
            const dateStr = new Date().toISOString().split('T')[0];

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${pick.title} [${dateStr}]`,
              body: pick.body,
              labels: ['enhancement', 'maintenance']
            });
