[package]
name = "polyglot-skills-core"
version = "0.1.0"
edition = "2021"
authors = ["Yuang <dev@example.com>"]
description = "High-performance Rust modules: lock-free data structures, concurrent thread pool, and SIMD-accelerated algorithms."
license = "MIT"

[lib]
name = "skills_core"
path = "src/rust/lib.rs"

[[bin]]
name = "skills_bench"
path = "src/rust/main.rs"

[dependencies]
crossbeam = "0.8.4"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
